# Develop Ultimate inside Docker: `docker compose up --build`, then open http://localhost:4747
# (or the port in ULTIMATE_PORT).
# See docs/docker.md.
services:
  ultimate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - '127.0.0.1:${ULTIMATE_PORT:-4747}:4748'
    volumes:
      - .:/workspace
      # Dependencies stay in the container, never in the host checkout.
      - node_modules:/workspace/node_modules
      # Logins, Ultimate state, Git config and the pnpm store.
      - home:/home/node
    environment:
      # Same number inside and outside, so Ultimate's loopback Host check passes.
      ULTIMATE_PORT: ${ULTIMATE_PORT:-4747}
    init: true
    tty: true
    stdin_open: true

volumes:
  node_modules:
  home:
